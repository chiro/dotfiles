[colors]
background = #282A2E
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/main]
width = 100%
height = 24pt
radius = 6

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 2pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = RictyDiminished:size=10;2
font-1 = Symbols Nerd Font Mono:size=12;2

modules-left = xworkspaces xwindow
modules-right = ${env:POLYBAR_MODULES_RIGHT:filesystem pulseaudio memory cpu wlan eth date systray}

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /

; ${colors.x} does not get substituted when nested inside an inline %{F...}
; tag (only as a standalone option value), so this uses the literal hex.
label-mounted = %{T2}%{F#F0C674}󰋊%{F-}%{T-} %percentage_used%%

label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
ramp-volume-font = 2
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.primary}

label-volume = %percentage%%

format-muted = <label-muted>
label-muted = 󰝟
label-muted-font = 2
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.primary}
format-prefix-font = 2
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = ${colors.primary}
format-prefix-font = 2
label = %percentage:2%%

[network-base]
type = internal/network
interval = 5
format-disconnected = <label-disconnected>
; ${colors.x} does not get substituted when nested inside an inline %{F...}
; tag (only as a standalone option value), so this uses literal hex codes.
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected%{F-}

[module/wlan]
inherit = network-base
interface-type = wireless
format-connected = <ramp-signal> <label-connected>
ramp-signal-font = 2
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
ramp-signal-foreground = ${colors.primary}
label-connected = %essid%

[module/eth]
inherit = network-base
interface-type = wired
; Hide the module entirely when the cable is unplugged, rather than
; burning bar space on "enp2s0 disconnected".
format-disconnected =
format-connected = <label-connected>
; ${colors.x} does not get substituted when nested inside an inline %{F...}
; tag (only as a standalone option value), so this uses the literal hex.
label-connected = %{T2}%{F#F0C674}󰈀%{F-}%{T-} %local_ip%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %{T2}󰅐%{T-} %date%
label-foreground = ${colors.primary}

[settings]
screenchange-reload = true

[module/battery]
type = internal/battery
low-at = 10
battery = ${env:POLYBAR_BATTERY:}
adapter = ${env:POLYBAR_ADAPTER:}
poll-interval = 5

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

ramp-capacity-font = 2
ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-foreground = ${colors.primary}

animation-charging-font = 2
animation-charging-0 = 󰂆
animation-charging-1 = 󰂈
animation-charging-2 = 󰂉
animation-charging-3 = 󰂊
animation-charging-4 = 󰂅
animation-charging-foreground = ${colors.primary}

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = Fully charged
label-low = BATTERY LOW

[module/backlight]
type = internal/backlight
card = ${env:POLYBAR_BACKLIGHT:}
; amdgpu's actual_brightness is on a different (lower) scale than the
; brightness file polybar writes to, which would throw off the displayed
; percentage. Read from brightness so the label matches brightnessctl.
use-actual-brightness = false
; Route scrolling through brightnessctl (same tool as the XF86MonBrightness
; keys in xmonad.hs) so both paths use the same step size and stay in sync.
scroll-up = brightnessctl set 5%+
scroll-down = brightnessctl set 5%-

format = <ramp> <label>
ramp-font = 2
ramp-0 = 󰃚
ramp-1 = 󰃛
ramp-2 = 󰃜
ramp-3 = 󰃝
ramp-4 = 󰃞
ramp-5 = 󰃟
ramp-6 = 󰃠
ramp-foreground = ${colors.primary}

label = %percentage%%

; vim:ft=dosini
